# Generated by setup/setup.py (run `python setup/setup.py build ...`). Placeholder values below.
bundle:
  name: device-lifecycle-portal

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_ops:
    description: Genie space for the operations view
  genie_space_northwind:
    description: Genie space for the Northwind Mobile portal
  genie_space_bastion:
    description: Genie space for the Bastion Protect portal

resources:
  apps:
    app:
      name: "device-lifecycle-portal"
      description: "White-labeled device lifecycle portal demo (Databricks Apps + AI/BI + Genie + Unity Catalog)"
      source_code_path: ./
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: Device Intelligence (Operations)
            space_id: ${var.genie_space_ops}
            permission: CAN_RUN
        - name: genie-space-northwind
          genie_space:
            name: Northwind Mobile Device Returns Assistant
            space_id: ${var.genie_space_northwind}
            permission: CAN_RUN
        - name: genie-space-bastion
          genie_space:
            name: Bastion Protect Claims Device Assistant
            space_id: ${var.genie_space_bastion}
            permission: CAN_RUN

targets:
  default:
    default: true
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
    variables:
      sql_warehouse_id: <warehouse-id>
      genie_space_ops: <genie-space-id>
      genie_space_northwind: <genie-space-id>
      genie_space_bastion: <genie-space-id>
